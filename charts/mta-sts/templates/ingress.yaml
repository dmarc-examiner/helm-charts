{{- if .Values.ingress.enabled }}
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: {{ include "mta-sts.fullname" . }}
  labels:
    {{- include "mta-sts.labels" . | nindent 4 }}
  {{- $annotations := deepCopy .Values.ingress.annotations }}
  {{- with .Values.ingress.certManager.clusterIssuer }}
  {{- $_ := set $annotations "cert-manager.io/cluster-issuer" . }}
  {{- end }}
  {{- with .Values.ingress.certManager.issuer }}
  {{- $_ := set $annotations "cert-manager.io/issuer" . }}
  {{- end }}
  {{- with $annotations }}
  annotations:
    {{- toYaml . | nindent 4 }}
  {{- end }}
spec:
  {{- with .Values.ingress.className }}
  ingressClassName: {{ . }}
  {{- end }}
  {{- if .Values.ingress.tls.enabled }}
  tls:
    - secretName: {{ include "mta-sts.tlsSecretName" . }}
      hosts:
        {{- range .Values.domains }}
        {{- $d := include "mta-sts.domain" (dict "root" $ "domain" .) | fromYaml }}
        - {{ $d.host }}
        {{- end }}
  {{- end }}
  rules:
    {{- range .Values.domains }}
    {{- $d := include "mta-sts.domain" (dict "root" $ "domain" .) | fromYaml }}
    - host: {{ $d.host }}
      http:
        paths:
          - path: /.well-known/mta-sts.txt
            pathType: Exact
            backend:
              service:
                name: {{ include "mta-sts.fullname" $ }}
                port:
                  name: http
    {{- end }}
{{- end }}
