name: Release

on:
  push:
    branches:
      - main
    paths:
      - charts/**

permissions:
  contents: write
  packages: write

env:
  HELM_VERSION: v3.22.1

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Configure Git
        run: |
          git config user.name "$GITHUB_ACTOR"
          git config user.email "$GITHUB_ACTOR@users.noreply.github.com"

      - uses: azure/setup-helm@v5.0.1
        with:
          version: ${{ env.HELM_VERSION }}

      - name: Publish GitHub release and Helm repository index
        id: cr
        uses: helm/chart-releaser-action@v1.9.0
        with:
          skip_existing: true
        env:
          CR_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push charts to GHCR
        if: steps.cr.outputs.changed_charts != ''
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          for pkg in .cr-release-packages/*.tgz; do
            for attempt in 1 2 3; do
              helm push "$pkg" "oci://ghcr.io/${GITHUB_REPOSITORY_OWNER}/charts" && break
              [ "$attempt" = 3 ] && exit 1
              sleep $((attempt * 10))
            done
          done
